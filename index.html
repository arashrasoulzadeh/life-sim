<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimYou</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0d10;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      #screen {
        image-rendering: pixelated;
        width: min(90vmin, 768px);
        height: min(90vmin, 768px);
        background: #000;
        box-shadow: 0 0 0 1px #222, 0 24px 80px rgba(0, 0, 0, 0.6);
      }
      #hint {
        position: fixed;
        bottom: 12px;
        color: #444;
        font-size: 11px;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" width="512" height="512"></canvas>
    <div id="hint">SIMYOU — a life runs itself · [F] fast-forward · [D] debug · [R] new life</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
