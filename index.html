<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimYou</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #0b0d10;
        color: #c8ccd4;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 16px 0 40px;
        box-sizing: border-box;
      }

      #topbar {
        display: flex;
        align-items: center;
        gap: 14px;
        width: min(90vmin, 768px);
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      #topbar b { color: #e6e9f0; letter-spacing: 0.12em; }
      #topbar .grow { flex: 1; }
      #tb-seed { color: #8fb8e8; }
      #tb-tok { color: #e0b45c; }
      #tb-note { color: #4b525e; font-size: 11px; }
      #zoombtn {
        font: inherit;
        font-size: 11px;
        color: #c8ccd4;
        background: #171b22;
        border: 1px solid #2b323d;
        border-radius: 4px;
        padding: 3px 9px;
        cursor: pointer;
      }
      #zoombtn:hover { background: #1f2530; }
      #zoombtn[hidden] { display: none; }

      #stage {
        position: relative;
        width: min(90vmin, 768px);
        height: min(90vmin, 768px);
        background: #000;
        box-shadow: 0 0 0 1px #222, 0 24px 80px rgba(0, 0, 0, 0.6);
      }

      /* room layer — the playfield is the top 87.5% (448/512); canvas is on top */
      #rooms {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 87.5%;
        z-index: 1;
        pointer-events: none;
        overflow: hidden;
      }
      #rooms.grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: repeat(3, 1fr);
      }
      #rooms .cell { position: relative; overflow: hidden; container-type: size; }
      #rooms.zoom .cell { display: none; }
      #rooms.zoom .cell.active { display: block; position: absolute; inset: 0; }

      #rooms .room { position: absolute; inset: 0; }
      #rooms .wall { position: absolute; inset: 0 0 40% 0; background: var(--wall); }
      #rooms .floor {
        position: absolute;
        inset: 60% 0 0 0;
        background: var(--floor);
        box-shadow: inset 0 3px 0 color-mix(in srgb, var(--accent) 55%, #000);
      }
      #rooms .floor::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(rgba(0, 0, 0, 0.05) 0 2px, transparent 2px 10px);
      }
      #rooms .furn { position: absolute; border-radius: 2px; overflow: hidden; }
      #rooms .obj {
        position: absolute;
        transform: translate(-50%, -50%);
        font-size: 8cqmin;
        line-height: 1;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.45));
      }
      #rooms.zoom .obj { font-size: 5cqmin; }
      #rooms .room-tag {
        position: absolute;
        left: 4px;
        top: 3px;
        font-size: 3cqmin;
        color: rgba(255, 255, 255, 0.32);
        letter-spacing: 0.04em;
        pointer-events: none;
      }
      #rooms.zoom .room-tag { display: none; }
      .ifr {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #05070a;
        pointer-events: none;
      }

      #screen {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        z-index: 2;
      }

      #hint {
        color: #444;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-align: center;
        max-width: 90vw;
      }
    </style>
  </head>
  <body>
    <div id="topbar">
      <b>SIMYOU</b>
      <span id="tb-seed">seed —</span>
      <span id="tb-tok">◊ 0</span>
      <span class="grow"></span>
      <button id="zoombtn" hidden>⤢ grid</button>
      <span id="tb-note">a life that runs itself</span>
    </div>

    <div id="stage">
      <div id="rooms" class="grid"></div>
      <canvas id="screen" width="512" height="512"></canvas>
    </div>

    <div id="hint">click a room to zoom · [M] memory · [C] conversations · [S] this life · [P] mute · [D] debug</div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
