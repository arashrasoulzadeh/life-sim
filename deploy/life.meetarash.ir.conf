# /etc/nginx/sites-available/life.meetarash.ir
# ln -s ../sites-available/life.meetarash.ir /etc/nginx/sites-enabled/
# then: certbot --nginx -d life.meetarash.ir   (adds the 443 server + redirect)

server {
    listen 80;
    listen [::]:80;
    server_name life.meetarash.ir;

    # SSE stream — must not be buffered
    location = /stream {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # trust the app's Cache-Control (it sends no-store for html/js/css)
        proxy_cache off;
    }
}

# If this domain is proxied through Cloudflare, Cloudflare caches .js/.css by
# file extension regardless of origin headers. Add a Cache Rule for
# life.meetarash.ir/*  ->  Cache eligibility: Bypass cache  (or set Caching >
# Configuration > Browser Cache TTL: "Respect Existing Headers"), otherwise a
# deploy won't reach viewers until Cloudflare's edge TTL expires.
